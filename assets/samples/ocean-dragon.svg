<svg width="980" height="460" viewBox="0 0 980 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ascii-shell-greets ocean dragon sample</title>
  <desc id="desc">Terminal style screenshot of ascii-shell-greets output with dragon art and ocean colors.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1c2d"/>
      <stop offset="100%" stop-color="#0a3653"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="980" height="460" fill="#070b12"/>
  <rect x="40" y="30" width="900" height="400" rx="14" fill="url(#bg)" stroke="#4db6ff" stroke-width="2"/>
  <rect x="40" y="30" width="900" height="38" rx="14" fill="#0d2a40"/>
  <circle cx="68" cy="49" r="8" fill="#ff5f56"/>
  <circle cx="92" cy="49" r="8" fill="#ffbd2e"/>
  <circle cx="116" cy="49" r="8" fill="#27c93f"/>
  <text x="140" y="55" fill="#b5e4ff" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="15">ascii-shell-greets --theme ocean --art dragon --fortune</text>

  <g font-family="Menlo, Monaco, 'Courier New', monospace" font-size="19" xml:space="preserve">
    <text x="78" y="108" fill="#4db6ff">      / \\</text>
    <text x="78" y="136" fill="#2fa7ff">  /\\ / _ \\</text>
    <text x="78" y="164" fill="#1f8fe0"> (  ) (_) )</text>
    <text x="78" y="192" fill="#4db6ff">  \\/\___/</text>

    <text x="78" y="244" fill="#bde9ff">+-------------------------------------------+</text>
    <text x="78" y="272" fill="#e7f8ff">| Good evening!                             |</text>
    <text x="78" y="300" fill="#bde9ff">| Fortune: Small commits, fewer regrets.    |</text>
    <text x="78" y="328" fill="#bde9ff">+-------------------------------------------+</text>

    <text x="78" y="382" fill="#95d8ff">$ ascii-shell-greets --list</text>
  </g>
</svg>
